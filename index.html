<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Study Timer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
    <style>
        :root {
            --window-bg: #ffffff;
            --title-bar: #e8e8e8;
            --border-color: #c0c0c0;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: 'Galmuri14', sans-serif;
            user-select: none; /* 드래그 방지 */
        }

        /* 윈도우 창 */
        .window {
            width: 320px;
            background: var(--window-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 상단 바 */
        .title-bar {
            height: 28px;
            background: var(--title-bar);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            justify-content: space-between;
        }

        .traffic-lights {
            display: flex;
            gap: 6px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
        .red { background-color: #ff5f57; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        .refresh-btn {
            cursor: pointer;
            font-size: 16px;
            color: #555;
            transition: transform 0.2s;
        }
        .refresh-btn:active { transform: rotate(180deg); }

        /* 내용 영역 */
        .content {
            padding: 30px 20px;
            text-align: center;
            background: #fff;
        }

        /* 타이머 텍스트 */
        .timer-display {
            font-size: 64px;
            margin: 10px 0 30px 0;
            color: #333;
            letter-spacing: 2px;
            font-weight: normal;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            font-family: 'Galmuri14', sans-serif;
            background: #fff;
            border: 2px solid #333;
            padding: 8px 16px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #333;
            transition: all 0.1s;
            outline: none;
        }

        button:active {
            box-shadow: 0px 0px 0px #333;
            transform: translate(3px, 3px);
        }

        /* 눌린 버튼 스타일 */
        button.active-btn {
            background-color: #333;
            color: #fff;
            box-shadow: 0px 0px 0px #333;
            transform: translate(3px, 3px);
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="refresh-btn" onclick="location.reload()">↻</div>
        </div>
        <div class="content">
            <div class="timer-display" id="timer">00 : 00</div>
            <div class="btn-group">
                <button id="btn-start" onclick="startTimer()">start</button>
                <button id="btn-stop" onclick="stopTimer()">stop</button>
                <button id="btn-reset" onclick="resetTimer()">reset</button>
            </div>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');

        // 페이지 로드 시 저장된 시간 불러오기 (새로고침 방지)
        window.onload = function() {
            const savedElapsed = localStorage.getItem('myStudyTime');
            const savedIsRunning = localStorage.getItem('myTimerRunning');
            const savedStartTime = localStorage.getItem('myStartTime');

            if (savedElapsed) {
                elapsedTime = parseInt(savedElapsed);
            }

            if (savedIsRunning === 'true' && savedStartTime) {
                // 실행 중이었다면 현재 시간과 비교해 시간 보정
                startTime = parseInt(savedStartTime);
                isRunning = true;
                timerInterval = setInterval(updateTime, 100); // 0.1초마다 갱신
                btnStart.classList.add('active-btn');
            } else {
                displayTime(elapsedTime);
            }
        };

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            // 시작 시간 = 현재 시간 - 이미 흐른 시간
            startTime = Date.now() - elapsedTime;
            
            timerInterval = setInterval(updateTime, 100);
            
            // 상태 저장
            saveState();
            
            // 버튼 스타일
            btnStart.classList.add('active-btn');
            btnStop.classList.remove('active-btn');
        }

        function stopTimer() {
            if (!isRunning) return;
            
            isRunning = false;
            clearInterval(timerInterval);
            
            // 상태 저장
            saveState();

            // 버튼 스타일
            btnStart.classList.remove('active-btn');
            btnStop.classList.add('active-btn');
            
            // 잠시 후 버튼 눌림 효과 해제 (선택사항)
            setTimeout(() => {
                btnStop.classList.remove('active-btn');
            }, 200);
        }

        function resetTimer() {
            stopTimer();
            elapsedTime = 0;
            displayTime(0);
            
            // 저장소 초기화
            localStorage.removeItem('myStudyTime');
            localStorage.removeItem('myTimerRunning');
            localStorage.removeItem('myStartTime');
        }

        function updateTime() {
            const now = Date.now();
            elapsedTime = now - startTime;
            displayTime(elapsedTime);
            saveState(); // 실시간 저장 (혹시 모를 종료 대비)
        }

        function displayTime(time) {
            const totalSeconds = Math.floor(time / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            // 60분이 넘어가면 시:분, 아니면 분:초 (요청하신 디자인 유지)
            // 만약 항상 시:분:초를 원하시면 수정 가능합니다.
            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            
            timerDisplay.innerText = `${mm} : ${ss}`;
        }

        function saveState() {
            localStorage.setItem('myStudyTime', elapsedTime);
            localStorage.setItem('myTimerRunning', isRunning);
            localStorage.setItem('myStartTime', startTime);
        }
    </script>
</body>
</html>
