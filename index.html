<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer (200px)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --bar-color: #f0f0f0;
            --border-color: #e0e0e0;
            --text-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: 'Galmuri14', sans-serif;
            user-select: none;
        }

        /* 윈도우 창 (너비 200px 설정) */
        .window {
            width: 200px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 상단 바 */
        .title-bar {
            height: 28px;
            background: var(--bar-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            justify-content: space-between;
        }

        .traffic-lights {
            display: flex;
            gap: 6px;
        }

        .dot { width: 9px; height: 9px; border-radius: 50%; }
        .red { background-color: #ff5f57; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        .refresh-btn {
            cursor: pointer;
            font-size: 13px;
            color: #888;
        }

        /* 내용 영역 */
        .content {
            padding: 18px 10px;
            text-align: center;
            background: #fff;
        }

        /* 타이머 텍스트 (200px에 맞게 조정) */
        .timer-display {
            font-size: 40px;
            margin: 5px 0 18px 0;
            color: #333;
            letter-spacing: 1px;
            font-weight: normal;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        button {
            font-family: 'Galmuri14', sans-serif;
            background: var(--bar-color);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:active, button.active-btn {
            background-color: #d1d1d1;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="refresh-btn" onclick="location.reload()">↻</div>
        </div>
        <div class="content">
            <div class="timer-display" id="timer">00 : 00</div>
            <div class="btn-group">
                <button id="btn-start" onclick="startTimer()">start</button>
                <button id="btn-stop" onclick="stopTimer()">stop</button>
                <button id="btn-reset" onclick="resetTimer()">reset</button>
            </div>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');

        // 상태 저장 키 (200px 버전용)
        const STORAGE_KEY_ELAPSED = 'timer200Elapsed';
        const STORAGE_KEY_RUNNING = 'timer200Running';
        const STORAGE_KEY_START = 'timer200Start';

        window.onload = function() {
            const savedElapsed = localStorage.getItem(STORAGE_KEY_ELAPSED);
            const savedIsRunning = localStorage.getItem(STORAGE_KEY_RUNNING);
            const savedStartTime = localStorage.getItem(STORAGE_KEY_START);

            if (savedElapsed) elapsedTime = parseInt(savedElapsed);

            if (savedIsRunning === 'true' && savedStartTime) {
                startTime = parseInt(savedStartTime);
                isRunning = true;
                timerInterval = setInterval(updateTime, 100);
                btnStart.classList.add('active-btn');
            } else {
                displayTime(elapsedTime);
            }
        };

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(updateTime, 100);
            saveState();
            
            btnStart.classList.add('active-btn');
            btnStop.classList.remove('active-btn');
        }

        function stopTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            saveState();

            btnStart.classList.remove('active-btn');
            btnStop.classList.add('active-btn');
            setTimeout(() => btnStop.classList.remove('active-btn'), 200);
        }

        function resetTimer() {
            stopTimer();
            elapsedTime = 0;
            displayTime(0);
            localStorage.removeItem(STORAGE_KEY_ELAPSED);
            localStorage.removeItem(STORAGE_KEY_RUNNING);
            localStorage.removeItem(STORAGE_KEY_START);
        }

        function updateTime() {
            const now = Date.now();
            elapsedTime = now - startTime;
            displayTime(elapsedTime);
            saveState();
        }

        function displayTime(time) {
            const totalSeconds = Math.floor(time / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            
            timerDisplay.innerText = `${mm} : ${ss}`;
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY_ELAPSED, elapsedTime);
            localStorage.setItem(STORAGE_KEY_RUNNING, isRunning);
            localStorage.setItem(STORAGE_KEY_START, startTime);
        }
    </script>
</body>
</html>
